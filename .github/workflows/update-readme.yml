name: Update README Logo Table

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch JSON and Generate Table
        run: |
          python -c '
          import urllib.request
          import json
          import sys

          url = "https://l.habyby.net/logo?format=list"
          print(f"Fetching data from {url}...")
          
          try:
              headers = {
                  "User-Agent": "Mozilla/5.0 (compatible; GitHubAction/1.0)",
                  "Accept": "application/json, text/plain, */*"
              }
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  body = response.read().decode("utf-8")
                  data = json.loads(body)
                  icons = data.get("icons", [])
              print(f"Successfully fetched {len(icons)} icons.")
          except Exception as e:
              print(f"Error fetching API: {e}")
              sys.exit(1)

          table_lines = [
              "<table>",
              "  <thead>",
              "    <tr>",
              "      <th>Icon</th><th>Preview</th>",
              "      <th>Icon</th><th>Preview</th>",
              "      <th>Icon</th><th>Preview</th>",
              "      <th>Icon</th><th>Preview</th>",
              "    </tr>",
              "  </thead>",
              "  <tbody>"
          ]

          for i in range(0, len(icons), 4):
              row_html = "    <tr>"
              chunk = icons[i:i+4]
              for icon in chunk:
                  name = icon["name"]
                  svg_url = icon["url"]
                  row_html += f"<td><code>{name}</code></td><td><img src=\"{svg_url}\" width=\"30\" alt=\"{name}\"></td>"
              
              if len(chunk) < 4:
                  for _ in range(4 - len(chunk)):
                      row_html += "<td></td><td></td>"
                      
              row_html += "</tr>"
              table_lines.append(row_html)

          table_lines.extend([
              "  </tbody>",
              "</table>"
          ])

          new_table = "\n".join(table_lines)

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          start_marker = "<!-- LOGOS_TABLE_START -->"
          end_marker = "<!-- LOGOS_TABLE_END -->"

          if start_marker in content and end_marker in content:
              start_idx = content.index(start_marker) + len(start_marker)
              end_idx = content.index(end_marker)
              updated_content = content[:start_idx] + "\n" + new_table + "\n" + content[end_idx:]
              
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(updated_content)
              print("README updated successfully.")
          else:
              print("Error: Markers <!-- LOGOS_TABLE_START --> or <!-- LOGOS_TABLE_END --> not found in README.md!")
              sys.exit(1)
          '

      - name: Commit and push if README changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update README icon table from API"
          branch: main
