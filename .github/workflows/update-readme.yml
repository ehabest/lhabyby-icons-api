name: Update README Logo Table

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch JSON and Generate Table
        run: |
          python - <<'PYEOF'
          import html
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          URL = "https://l.habyby.net/logo?format=list"
          START = "<!-- LOGOS_TABLE_START -->"
          END = "<!-- LOGOS_TABLE_END -->"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; GitHubAction/1.0)",
              "Accept": "application/json, text/plain, */*",
          }

          def fetch_icons():
              last_error = None
              for attempt in range(1, 4):
                  print(f"Fetching {URL} (attempt {attempt}/3)...")
                  try:
                      req = urllib.request.Request(URL, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          print(f"HTTP {resp.status}, Content-Type: {resp.headers.get('Content-Type')}")
                          data = json.loads(resp.read().decode("utf-8"))
                      icons = data.get("icons", [])
                      if not isinstance(icons, list) or not icons:
                          raise ValueError("API returned no icons array")
                      return icons
                  except urllib.error.HTTPError as e:
                      body = e.read(300).decode("utf-8", "replace")
                      last_error = f"HTTP {e.code} {e.reason}. Body starts: {body!r}"
                  except Exception as e:
                      last_error = f"{type(e).__name__}: {e}"
                  print(f"Attempt {attempt} failed: {last_error}")
                  if attempt < 3:
                      time.sleep(10 * attempt)
              print(f"ERROR: could not fetch the icon list. Last error: {last_error}")
              sys.exit(1)

          icons = fetch_icons()
          print(f"Successfully fetched {len(icons)} icons.")

          rows = [
              "<table>",
              "  <thead>",
              "    <tr>",
              "      <th>Icon</th><th>Preview</th>",
              "      <th>Icon</th><th>Preview</th>",
              "      <th>Icon</th><th>Preview</th>",
              "      <th>Icon</th><th>Preview</th>",
              "    </tr>",
              "  </thead>",
              "  <tbody>",
          ]
          for i in range(0, len(icons), 4):
              chunk = icons[i:i + 4]
              cells = ""
              for icon in chunk:
                  name = html.escape(str(icon["name"]), quote=True)
                  url = html.escape(str(icon["url"]), quote=True)
                  cells += (
                      f'<td><code>{name}</code></td>'
                      f'<td><img src="{url}" width="30" alt="{name}"></td>'
                  )
              cells += "<td></td><td></td>" * (4 - len(chunk))
              rows.append(f"    <tr>{cells}</tr>")
          rows += ["  </tbody>", "</table>"]
          new_table = "\n".join(rows)

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          if START not in content or END not in content:
              print(f"ERROR: markers {START} and {END} must both be in README.md")
              sys.exit(1)

          start_idx = content.index(START) + len(START)
          if END not in content[start_idx:]:
              print("ERROR: the END marker must come AFTER the START marker")
              sys.exit(1)
          end_idx = content.index(END, start_idx)

          updated = content[:start_idx] + "\n" + new_table + "\n" + content[end_idx:]
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          print("README updated successfully.")
          PYEOF

      - name: Commit and push if README changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update README icon table from API"
          branch: main
          file_pattern: README.md
